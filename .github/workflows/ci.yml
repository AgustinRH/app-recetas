name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: false
      - run: npm test -- --passWithNoTests
      - run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      # Pin below latest stable (3.50) to match a pre-material_ui-deprecation SDK;
      # --no-fatal-infos keeps Material import infos from failing the job.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build every Dockerfile
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name 'Dockerfile' -o -name 'Dockerfile.*' | grep -v node_modules || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 1
          fi
          for f in "${files[@]}"; do
            dir=$(dirname "$f")
            tag="ci-$(basename "$dir" | tr '[:upper:]' '[:lower:]')"
            echo "::group::docker build -f $f ($tag)"
            docker build -f "$f" -t "$tag" "$dir"
            echo "::endgroup::"
          done
