services:
  postgres:
    image: postgres:16-alpine
    container_name: dishtoday-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dishtoday-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    container_name: dishtoday-typesense
    restart: unless-stopped
    env_file:
      - .env
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    volumes:
      - typesense_data:/data
    ports:
      - "127.0.0.1:8108:8108"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dishtoday-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_TYPE: postgres
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    expose:
      - "3000"
    networks:
      - default
      - web_proxy

  web:
    image: nginx:alpine
    container_name: dishtoday-web
    restart: unless-stopped
    volumes:
      - ../mobile/build/web:/usr/share/nginx/html:ro
      - ./web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - default
      - web_proxy

  caddy:
    image: caddy:2-alpine
    container_name: dishtoday-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 80/443: reverse proxy on the host
      - "3010:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  api_uploads:
  caddy_data:
  caddy_config:

networks:
  web_proxy:
    external: true
