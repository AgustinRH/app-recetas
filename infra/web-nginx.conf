server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    # Flutter web no versiona los nombres de fichero (main.dart.js, etc.).
    # Sin esto el navegador reutiliza el bundle viejo durante días tras un deploy.
    # "no-cache" = puede guardarlo, pero revalida siempre (304 si no cambió).
    add_header Cache-Control "no-cache" always;
    etag on;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
